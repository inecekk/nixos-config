[main]
term=xterm-256color
font=JetBrains Mono:size=10, WenQuanYi Micro Hei Mono:size=10
dpi-aware=yes
pad=3x1 center
selection-target=clipboard
resize-delay-ms=10
word-delimiters= ,│`|:"'()[]{}<>@%
bold-text-in-bright=yes

[scrollback]
lines=1000

[csd]
preferred=none

[colors-dark]
alpha=0.8
foreground=f2edff
selection-background=9d8fd0
selection-foreground=1f1b33
regular0=2e3436
regular1=cc0000
regular2=4e9a06
regular3=c4a000
regular4=3465a4
regular5=75507b
regular6=06989a
regular7=d3d7cf
bright0=555753
bright1=ef2929
bright2=8ae234
bright3=fce94f
bright4=729fcf
bright5=ad7fa8
bright6=34e2e2
bright7=eeeeec

[bell]
notify=no
visual=no

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[mouse-bindings]
select-extend=none
clipboard-paste=BTN_RIGHT
